services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: aidev
      POSTGRES_USER: aidev
      POSTGRES_PASSWORD: aidev
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aidev -d aidev"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
