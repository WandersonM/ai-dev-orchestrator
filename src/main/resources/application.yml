spring:
  application:
    name: ai-dev-orchestrator
  datasource:
    url: jdbc:postgresql://localhost:5432/aidev
    username: aidev
    password: aidev
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
server:
  port: 8080
springdoc:
  swagger-ui:
    path: /swagger-ui.html
aidev:
  workspace-root: ${AIDEV_WORKSPACE_ROOT:./workspace}
  llm:
    routes:
      refinement:
        provider: ${AIDEV_REFINEMENT_PROVIDER:GEMINI}
        model: ${AIDEV_REFINEMENT_MODEL:gemini-3.7-flash}
      backend:
        provider: ${AIDEV_BACKEND_PROVIDER:OPENAI}
        model: ${AIDEV_BACKEND_MODEL:gpt-5.6-sol}
      review:
        provider: ${AIDEV_REVIEW_PROVIDER:OPENAI}
        model: ${AIDEV_REVIEW_MODEL:gpt-5.6-sol}
    openai:
      api-key: ${OPENAI_API_KEY:}
      base-url: ${OPENAI_BASE_URL:https://api.openai.com}
    gemini:
      api-key: ${GEMINI_API_KEY:}
      base-url: ${GEMINI_BASE_URL:https://generativelanguage.googleapis.com}
