spring:
  application:
    name: ai-dev-orchestrator
  datasource:
    url: jdbc:postgresql://localhost:5432/aidev
    username: aidev
    password: aidev
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
server:
  address: ${AIDEV_SERVER_ADDRESS:127.0.0.1}
  port: ${SERVER_PORT:8080}
springdoc:
  swagger-ui:
    path: /swagger-ui.html
aidev:
  workspace-root: ${AIDEV_WORKSPACE_ROOT:./workspace}
  security:
    control-token: ${AIDEV_CONTROL_TOKEN:}
  command-policy:
    allowed-executables: [git, mvn, ./mvnw, gradle, ./gradlew, npm, pnpm, grep, find, cat]
  orchestration:
    max-parallel: ${AIDEV_MAX_PARALLEL:3}
  execution:
    max-captured-output-bytes: ${AIDEV_MAX_CAPTURED_OUTPUT_BYTES:2097152}
    self-hosted-worker:
      client-enabled: ${AIDEV_WORKER_CLIENT_ENABLED:false}
      server-enabled: ${AIDEV_WORKER_SERVER_ENABLED:false}
      base-url: ${AIDEV_WORKER_BASE_URL:http://localhost:8090}
      token: ${AIDEV_WORKER_TOKEN:}
      workspace-root: ${AIDEV_WORKER_WORKSPACE_ROOT:${AIDEV_WORKSPACE_ROOT:./workspace}}
  agents:
    planning:
      max-rounds: ${AIDEV_PLANNING_MAX_ROUNDS:3}
    architect:
      max-steps: ${AIDEV_ARCHITECT_MAX_STEPS:12}
    backend:
      max-steps: ${AIDEV_BACKEND_MAX_STEPS:20}
    frontend:
      max-steps: ${AIDEV_FRONTEND_MAX_STEPS:20}
    qa:
      max-steps: ${AIDEV_QA_MAX_STEPS:16}
    integration:
      max-steps: ${AIDEV_INTEGRATION_MAX_STEPS:12}
    review:
      max-steps: ${AIDEV_REVIEW_MAX_STEPS:10}
      max-iterations: ${AIDEV_REVIEW_MAX_ITERATIONS:3}
    critic:
      max-steps: ${AIDEV_CRITIC_MAX_STEPS:8}
    security:
      max-steps: ${AIDEV_SECURITY_MAX_STEPS:10}
    domain-guardian:
      max-steps: ${AIDEV_DOMAIN_GUARDIAN_MAX_STEPS:10}
    release:
      max-steps: ${AIDEV_RELEASE_MAX_STEPS:8}
  tool-policy:
    default-effect: DENY
    policies:
      REFINER:
        allow: []
        deny: ['*']
      ARCHITECT:
        allow: [search_code, read_file, project_knowledge]
        deny: [write_file, run_command]
      BACKEND_DEVELOPER:
        allow: [search_code, read_file, write_file, run_command, project_knowledge]
        deny: []
      FRONTEND_DEVELOPER:
        allow: [search_code, read_file, write_file, run_command, project_knowledge]
        deny: []
      QA_ENGINEER:
        allow: [search_code, read_file, write_file, run_command, project_knowledge]
        deny: []
      REVIEWER:
        allow: [search_code, read_file, project_knowledge]
        deny: [write_file, run_command]
      CRITIC:
        allow: [search_code, read_file, project_knowledge]
        deny: [write_file, run_command]
      SECURITY_REVIEWER:
        allow: [search_code, read_file, project_knowledge]
        deny: [write_file, run_command]
      INTEGRATION_ENGINEER:
        allow: [search_code, read_file, write_file, run_command, project_knowledge]
        deny: []
      RELEASE_ENGINEER:
        allow: [search_code, read_file, project_knowledge]
        deny: [write_file, run_command]
      DOMAIN_GUARDIAN:
        allow: [search_code, read_file, project_knowledge]
        deny: [write_file, run_command]
  github:
    publish-enabled: ${AIDEV_GITHUB_PUBLISH_ENABLED:false}
    token: ${AIDEV_GITHUB_TOKEN:}
    webhook-secret: ${AIDEV_GITHUB_WEBHOOK_SECRET:}
    api-base-url: ${AIDEV_GITHUB_API_BASE_URL:https://api.github.com}
    base-branch: ${AIDEV_GITHUB_BASE_BRANCH:main}
  trello:
    enabled: ${AIDEV_TRELLO_ENABLED:false}
    api-key: ${AIDEV_TRELLO_API_KEY:}
    token: ${AIDEV_TRELLO_TOKEN:}
    base-url: ${AIDEV_TRELLO_BASE_URL:https://api.trello.com}
    polling-enabled: ${AIDEV_TRELLO_POLLING_ENABLED:true}
    polling-interval-ms: ${AIDEV_TRELLO_POLLING_INTERVAL_MS:30000}
  mcp:
    enabled: ${AIDEV_MCP_ENABLED:false}
    request-timeout: ${AIDEV_MCP_REQUEST_TIMEOUT:30s}
    servers: {}
  llm:
    resilience:
      enabled: ${AIDEV_LLM_FALLBACK_ENABLED:true}
      failure-threshold: ${AIDEV_LLM_FAILURE_THRESHOLD:3}
      open-duration: ${AIDEV_LLM_OPEN_DURATION:45s}
      fallback-openai-model: ${AIDEV_FALLBACK_OPENAI_MODEL:gpt-5.6-sol}
      fallback-gemini-model: ${AIDEV_FALLBACK_GEMINI_MODEL:gemini-3.7-flash}
    routes:
      refinement:
        provider: ${AIDEV_REFINEMENT_PROVIDER:GEMINI}
        model: ${AIDEV_REFINEMENT_MODEL:gemini-3.7-flash}
      architecture:
        provider: ${AIDEV_ARCHITECTURE_PROVIDER:OPENAI}
        model: ${AIDEV_ARCHITECTURE_MODEL:gpt-5.6-sol}
      backend:
        provider: ${AIDEV_BACKEND_PROVIDER:OPENAI}
        model: ${AIDEV_BACKEND_MODEL:gpt-5.6-sol}
      frontend:
        provider: ${AIDEV_FRONTEND_PROVIDER:GEMINI}
        model: ${AIDEV_FRONTEND_MODEL:gemini-3.7-flash}
      qa:
        provider: ${AIDEV_QA_PROVIDER:GEMINI}
        model: ${AIDEV_QA_MODEL:gemini-3.7-flash}
      review:
        provider: ${AIDEV_REVIEW_PROVIDER:OPENAI}
        model: ${AIDEV_REVIEW_MODEL:gpt-5.6-sol}
      critic:
        provider: ${AIDEV_CRITIC_PROVIDER:GEMINI}
        model: ${AIDEV_CRITIC_MODEL:gemini-3.7-flash}
      security:
        provider: ${AIDEV_SECURITY_PROVIDER:OPENAI}
        model: ${AIDEV_SECURITY_MODEL:gpt-5.6-sol}
      integration:
        provider: ${AIDEV_INTEGRATION_PROVIDER:OPENAI}
        model: ${AIDEV_INTEGRATION_MODEL:gpt-5.6-sol}
      release:
        provider: ${AIDEV_RELEASE_PROVIDER:OPENAI}
        model: ${AIDEV_RELEASE_MODEL:gpt-5.6-sol}
      domain-validation:
        provider: ${AIDEV_DOMAIN_VALIDATION_PROVIDER:GEMINI}
        model: ${AIDEV_DOMAIN_VALIDATION_MODEL:gemini-3.7-flash}
    openai:
      api-key: ${OPENAI_API_KEY:}
      base-url: ${OPENAI_BASE_URL:https://api.openai.com}
    gemini:
      api-key: ${GEMINI_API_KEY:}
      base-url: ${GEMINI_BASE_URL:https://generativelanguage.googleapis.com}
